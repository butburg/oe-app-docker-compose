<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Features Kanban Board</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #283548;
      --column-bg: #182234;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --priority-high: #ef4444;
      --priority-med: #f59e0b;
      --priority-low: #10b981;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background-color: #0b1120;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      background: #1e293b;
      color: var(--accent);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toolbar input,
    .toolbar select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      outline: none;
    }

    .toolbar input:focus {
      border-color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--card-hover);
    }

    .board-container {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 20px 24px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .column {
      flex: 0 0 310px;
      background: var(--column-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }

    .column-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .column-header .count {
      background: var(--card-bg);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-list {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 120px;
    }

    .card-list.drag-over {
      background: rgba(56, 189, 248, 0.08);
      border-radius: var(--radius);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: #475569;
    }

    .card.dragging {
      opacity: 0.4;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
    }

    .card-id {
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .badge-priority {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .priority-high {
      background: rgba(239, 68, 68, 0.2);
      color: var(--priority-high);
    }

    .priority-medium {
      background: rgba(245, 158, 11, 0.2);
      color: var(--priority-med);
    }

    .priority-low {
      background: rgba(16, 185, 129, 0.2);
      color: var(--priority-low);
    }

    .card-title {
      font-size: 0.925rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .tag {
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(2px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      overflow-y: auto;
      scrollbar-gutter: stable;
      padding: 5vh 0;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 90%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      margin: auto;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.1rem;
    }

    .modal-body {
      padding: 20px;
      overflow: visible;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-body label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .modal-body input,
    .modal-body select,
    .modal-body textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      outline: none;
    }

    .modal-body textarea {
      font-family: monospace;
      resize: none;
      overflow: hidden;
      min-height: 140px;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--text);
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <h1>Features Kanban</h1>
      <span>docs/features</span>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search features..." oninput="renderBoard()">
      <select id="priorityFilter" onchange="renderBoard()">
        <option value="all">All Priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <button class="btn btn-secondary" id="reloadFeaturesBtn" onclick="loadFeaturesFromApi()">
        ↻ Reload features
      </button>
      <span id="syncStatus" role="status" aria-live="polite">Loading features...</span>
      <button class="btn" id="newFeatureBtn" onclick="openNewFeatureModal()" disabled>+ New Feature</button>
    </div>
  </header>

  <div class="board-container" id="boardContainer"></div>

  <!-- Detail / Edit Modal -->
  <div class="modal-backdrop" id="featureModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalId">Feature Detail</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          <label>ID</label>
          <input type="text" id="modalFieldId">
        </div>
        <div>
          <label>Title</label>
          <input type="text" id="modalFieldTitle">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label>Status</label>
            <select id="modalFieldStatus">
              <option value="backlog">Backlog</option>
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="review">Review</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div>
            <label>Priority</label>
            <select id="modalFieldPriority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div>
          <label>Tags (comma separated)</label>
          <input type="text" id="modalFieldTags">
        </div>
        <div>
          <label>Markdown Content</label>
          <textarea id="modalFieldBody" oninput="resizeMarkdownContent()"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn" onclick="saveFeatureFromModal()">Save to Markdown</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COLUMNS = [
      { id: 'backlog', title: 'Backlog', icon: '📥' },
      { id: 'todo', title: 'To Do', icon: '📋' },
      { id: 'in-progress', title: 'In Progress', icon: '🚀' },
      { id: 'review', title: 'In Review', icon: '🔍' },
      { id: 'done', title: 'Done', icon: '✅' }
    ];

    let features = [];
    let currentEditingId = null;

    function setSyncStatus(message) {
      document.getElementById('syncStatus').textContent = message;
    }

    async function loadFeaturesFromApi() {
      setSyncStatus('Loading features...');
      try {
        const response = await fetch('/api/features', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        const markdownFiles = await response.json();
        features = markdownFiles.map(({ fileName, markdown }) => {
          const { frontmatter, body } = parseFrontmatter(markdown);
          return {
            id: frontmatter.id,
            title: frontmatter.title,
            status: frontmatter.status || 'backlog',
            priority: frontmatter.priority || 'medium',
            category: frontmatter.category || 'feature',
            assignee: frontmatter.assignee || 'unassigned',
            created: frontmatter.created || '',
            updated: frontmatter.updated || '',
            tags: Array.isArray(frontmatter.tags) ? frontmatter.tags : [],
            metadata: frontmatter,
            body,
            fileName
          };
        }).filter(feature => feature.id && feature.title)
          .sort((left, right) => left.id.localeCompare(right.id, undefined, { numeric: true }));
        document.getElementById('newFeatureBtn').disabled = false;
        setSyncStatus(`${features.length} feature(s) loaded from docs/features`);
        renderBoard();
      } catch (error) {
        setSyncStatus(`Could not load features. Start the local board server: ${error.message}`);
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function renderBoard() {
      const container = document.getElementById('boardContainer');
      const searchQuery = (document.getElementById('searchInput').value || '').toLowerCase();
      const priorityFilter = document.getElementById('priorityFilter').value;

      container.innerHTML = '';

      COLUMNS.forEach(col => {
        const colEl = document.createElement('div');
        colEl.className = 'column';

        const filtered = features.filter(f => {
          if (f.status !== col.id) return false;
          if (priorityFilter !== 'all' && f.priority !== priorityFilter) return false;
          if (searchQuery && !f.title.toLowerCase().includes(searchQuery) && !f.id.toLowerCase().includes(searchQuery)) return false;
          return true;
        });

        colEl.innerHTML = `
          <div class="column-header">
            <span>${col.icon} ${col.title}</span>
            <span class="count">${filtered.length}</span>
          </div>
          <div class="card-list" data-column-id="${col.id}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, '${col.id}')">
          </div>
        `;

        const listEl = colEl.querySelector('.card-list');

        filtered.forEach(feat => {
          const card = document.createElement('div');
          card.className = 'card';
          card.draggable = true;
          card.ondragstart = (e) => onDragStart(e, feat.id);
          card.ondragend = (e) => onDragEnd(e);
          card.onclick = () => openEditModal(feat.id);

          const priorityClass = `priority-${feat.priority || 'medium'}`;
          const tagsHtml = (feat.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

          card.innerHTML = `
            <div class="card-top">
              <span class="card-id">${escapeHtml(feat.id)}</span>
              <span class="badge-priority ${priorityClass}">${feat.priority || 'med'}</span>
            </div>
            <div class="card-title">${escapeHtml(feat.title)}</div>
            <div class="card-tags">${tagsHtml}</div>
          `;
          listEl.appendChild(card);
        });

        container.appendChild(colEl);
      });
    }

    let draggedId = null;

    function onDragStart(e, id) {
      draggedId = id;
      e.target.classList.add('dragging');
      e.dataTransfer.setData('text/plain', id);
    }

    function onDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.card-list').forEach(el => el.classList.remove('drag-over'));
    }

    function onDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    async function onDrop(e, columnId) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (!draggedId) return;

      const feat = features.find(f => f.id === draggedId);
      if (feat && feat.status !== columnId) {
        const previousStatus = feat.status;
        feat.status = columnId;
        feat.updated = new Date().toISOString().slice(0, 10);
        try {
          await writeFeatureFile(feat);
          setSyncStatus(`Saved ${feat.id} to docs/features`);
          renderBoard();
        } catch (error) {
          feat.status = previousStatus;
          setSyncStatus(`Could not save ${feat.id}: ${error.message}`);
          renderBoard();
        }
      }
      draggedId = null;
    }

    function openEditModal(id) {
      currentEditingId = id;
      const feat = features.find(f => f.id === id);
      if (!feat) return;

      document.getElementById('modalId').innerText = feat.id + ' — Details';
      document.getElementById('modalFieldId').value = feat.id;
      document.getElementById('modalFieldId').disabled = true;
      document.getElementById('modalFieldTitle').value = feat.title;
      document.getElementById('modalFieldStatus').value = feat.status;
      document.getElementById('modalFieldPriority').value = feat.priority || 'medium';
      document.getElementById('modalFieldTags').value = (feat.tags || []).join(', ');
      document.getElementById('modalFieldBody').value = feat.body || '';

      document.getElementById('featureModal').classList.add('open');
      requestAnimationFrame(resizeMarkdownContent);
    }

    function openNewFeatureModal() {
      currentEditingId = 'NEW';
      const nextNum = features.reduce((max, feature) => {
        const match = feature.id.match(/^FEAT-(\d+)$/i);
        return Math.max(max, match ? Number(match[1]) : 0);
      }, 0) + 1;
      const newId = `FEAT-${String(nextNum).padStart(3, '0')}`;

      document.getElementById('modalId').innerText = 'Create New Feature';
      document.getElementById('modalFieldId').value = newId;
      document.getElementById('modalFieldId').disabled = false;
      document.getElementById('modalFieldTitle').value = '';
      document.getElementById('modalFieldStatus').value = 'backlog';
      document.getElementById('modalFieldPriority').value = 'medium';
      document.getElementById('modalFieldTags').value = '';
      document.getElementById('modalFieldBody').value = '## Overview\n\n## Problem Statement\n\n## Acceptance Criteria\n- [ ] ';

      document.getElementById('featureModal').classList.add('open');
      requestAnimationFrame(resizeMarkdownContent);
    }

    function resizeMarkdownContent() {
      const textarea = document.getElementById('modalFieldBody');
      const borderHeight = parseFloat(getComputedStyle(textarea).borderTopWidth)
        + parseFloat(getComputedStyle(textarea).borderBottomWidth);
      for (let attempt = 0; attempt < 5; attempt++) {
        textarea.style.height = 'auto';
        textarea.style.height = `${textarea.scrollHeight + borderHeight}px`;
        if (textarea.scrollHeight <= textarea.clientHeight) break;
      }
    }

    function closeModal() {
      document.getElementById('featureModal').classList.remove('open');
    }

    async function saveFeatureFromModal() {
      const id = document.getElementById('modalFieldId').value.trim();
      const title = document.getElementById('modalFieldTitle').value.trim();
      const status = document.getElementById('modalFieldStatus').value;
      const priority = document.getElementById('modalFieldPriority').value;
      const tags = document.getElementById('modalFieldTags').value.split(',').map(t => t.trim()).filter(Boolean);
      const body = document.getElementById('modalFieldBody').value;
      const existing = currentEditingId === 'NEW' ? null : features.find(feature => feature.id === currentEditingId);

      if (!id || !title) {
        alert('ID and Title are required');
        return;
      }
      if (features.some(feature => feature.id === id && feature.id !== currentEditingId)) {
        alert(`A feature with ID ${id} already exists.`);
        return;
      }

      const today = new Date().toISOString().slice(0, 10);
      const feature = {
        ...existing,
        id,
        title,
        status,
        priority,
        category: existing?.category || 'feature',
        assignee: existing?.assignee || 'unassigned',
        created: existing?.created || today,
        updated: today,
        metadata: existing?.metadata || {},
        tags,
        body,
        fileName: existing?.fileName || `${id.toLowerCase()}-${slugify(title)}.md`
      };

      try {
        await writeFeatureFile(feature);
        if (existing) {
          features[features.indexOf(existing)] = feature;
        } else {
          features.push(feature);
          features.sort((left, right) => left.id.localeCompare(right.id, undefined, { numeric: true }));
        }
        closeModal();
        renderBoard();
        setSyncStatus(`Saved ${feature.id} to docs/features`);
      } catch (error) {
        setSyncStatus(`Could not save ${feature.id}: ${error.message}`);
      }
    }

    function toMarkdown(feat) {
      const tagsFormatted = (feat.tags || []).map(tag => `  - ${JSON.stringify(tag)}`).join('\n');
      const body = feat.body.trim() || `# ${feat.title}`;
      const knownFields = new Set(['id', 'title', 'status', 'priority', 'category', 'assignee', 'created', 'updated', 'tags']);
      const extraFields = Object.entries(feat.metadata || {})
        .filter(([key, value]) => !knownFields.has(key) && /^[a-zA-Z_][\w-]*$/.test(key) && !Array.isArray(value))
        .map(([key, value]) => `${key}: ${JSON.stringify(String(value))}`)
        .join('\n');
      return `---
id: ${feat.id}
title: ${JSON.stringify(feat.title)}
status: ${feat.status}
priority: ${feat.priority || 'medium'}
category: ${feat.category || 'feature'}
assignee: ${JSON.stringify(feat.assignee || 'unassigned')}
created: ${feat.created || new Date().toISOString().slice(0, 10)}
updated: ${feat.updated || new Date().toISOString().slice(0, 10)}
tags:
${tagsFormatted}
${extraFields ? `${extraFields}\n` : ''}---

${body}
`;
    }

    async function writeFeatureFile(feature) {
      const response = await fetch(`/api/features/${encodeURIComponent(feature.fileName)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'text/markdown; charset=utf-8' },
        body: toMarkdown(feature)
      });
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        throw new Error(result.error || `Server returned ${response.status}`);
      }
    }

    function slugify(text) {
      return text.toString().toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^\w-]+/g, '')
        .replace(/-+/g, '-')
        .replace(/^-+/, '')
        .replace(/-+$/, '');
    }

    function parseFrontmatter(mdText) {
      const match = mdText.match(/^---([\s\S]*?)---([\s\S]*)$/);
      if (!match) return { frontmatter: {}, body: mdText };

      const yamlBlock = match[1];
      const body = match[2].trim();
      const frontmatter = {};

      const lines = yamlBlock.split('\n');
      let currentArrayKey = null;

      for (let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('#')) continue;

        if (line.startsWith('- ') && currentArrayKey) {
          frontmatter[currentArrayKey].push(parseScalar(line.replace(/^- /, '').trim()));
          continue;
        }

        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.slice(0, colonIdx).trim();
          let val = line.slice(colonIdx + 1).trim();
          if (val === '') {
            currentArrayKey = key;
            frontmatter[key] = [];
          } else {
            currentArrayKey = null;
            frontmatter[key] = parseScalar(val);
          }
        }
      }

      return { frontmatter, body };
    }

    function parseScalar(value) {
      const scalar = value.trim();
      if (scalar.startsWith('"') && scalar.endsWith('"')) {
        try {
          return JSON.parse(scalar);
        } catch { }
      }
      if (scalar.startsWith("'") && scalar.endsWith("'")) return scalar.slice(1, -1).replace(/''/g, "'");
      return scalar;
    }

    loadFeaturesFromApi();
  </script>
</body>

</html>
